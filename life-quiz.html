<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>超慢跑生活題庫版</title>
  <style>
    :root {
      --bg: #111111;
      --card: #1e1e1e;
      --accent: #4a90e2;
      --accent-soft: #f5a623;
      --text-main: #f5f5f5;
      --text-sub: #cccccc;
      --text-light: rgba(204, 204, 204, 0.4);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Microsoft JhengHei", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      background: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 520px;
      background: var(--card);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      height: 90vh;
      max-height: 820px;
      position: relative;
    }

    .title {
      text-align: center;
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--accent-soft);
      margin-bottom: 6px;
      white-space: nowrap;
    }

    .controls-top {
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 10px 0 16px;
      border-bottom: 1px solid #333;
      margin-bottom: 12px;
    }

    .control-group {
      text-align: center;
      min-width: 140px;
    }

    .control-label {
      font-size: 0.85rem;
      color: var(--text-sub);
      margin-bottom: 4px;
    }

    .control-value {
      font-size: 1.1rem;
      color: var(--accent-soft);
      font-weight: 600;
      margin-bottom: 4px;
    }

    input[type="range"] {
      width: 120px;
      height: 6px;
      accent-color: var(--accent);
      border-radius: 3px;
      margin-bottom: 2px;
    }

    .range-labels {
      display: flex;
      justify-content: space-between;
      font-size: 0.65rem;
      color: var(--text-light);
      margin-top: 2px;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 12px 0 14px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      border-radius: 22px;
      padding: 10px 18px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      flex: 1;
      max-width: 110px;
      white-space: nowrap;
    }

    #startBtn {
      background: linear-gradient(135deg, var(--accent), #357abd);
      color: white;
      box-shadow: 0 4px 12px rgba(74,144,226,0.4);
    }

    #pauseBtn, #stopBtn, #musicBtn {
      background: #444;
      color: var(--text-main);
    }

    #musicBtn.active {
      background: linear-gradient(135deg, #4CAF50, #45a049);
      box-shadow: 0 4px 12px rgba(76,175,80,0.4);
    }

    button:disabled {
      opacity: 0.4;
      cursor: default;
    }

    button:not(:disabled):hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(0,0,0,0.5);
    }

    .math-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 0;
      position: relative;
    }

    .math-panel {
      background: rgba(0,0,0,0.2);
      border-radius: 14px;
      padding: 20px 16px;
      width: 100%;
      max-width: 440px;
      text-align: center;
    }

    #topic {
      font-size: 1.1rem;
      color: var(--accent-soft);
      margin-bottom: 6px;
      min-height: 1.2em;
    }

    #math {
      font-weight: 800;
      line-height: 1.05;
      white-space: nowrap;   /* 強制一行 */
      overflow: hidden;      /* 超出不換行，由 JS 縮字 */
      max-width: 100%;
      margin-bottom: 8px;
    }

    #message {
      font-size: 1rem;
      color: var(--text-sub);
      min-height: 1.2em;
    }

    .stats-panel {
      position: absolute;
      inset: 0;
      margin: auto;
      width: 80%;
      max-width: 380px;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(10px);
      border: 2px solid var(--accent);
      border-radius: 16px;
      padding: 22px 18px;
      text-align: center;
      z-index: 100;
      box-sizing: border-box;
      display: none;
      flex-direction: column;
      justify-content: center;
      gap: 10px;
    }

    .stats-panel.show {
      display: flex;
    }

    .stats-title {
      margin: 0;
      color: var(--accent-soft);
      font-size: 1.2rem;
      font-weight: 600;
    }

    .stat-line {
      font-size: 1rem;
      color: var(--text-main);
      line-height: 1.4;
      margin: 4px 0;
    }

    .stat-value {
      color: var(--accent-soft);
      font-weight: 700;
      font-size: 1.3rem;
    }

    .stats-buttons {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 8px;
      flex-wrap: nowrap;
    }

    .stats-btn {
      flex: 1;
      min-width: 0;
    }

    #restartBtn, #pauseRestartBtn {
      background: linear-gradient(135deg, var(--accent-soft), #d98c1a);
      color: white;
    }

    #resumeBtn {
      background: linear-gradient(135deg, var(--accent), #357abd);
      color: white;
    }

    .bottom-wrapper {
      border-top: 1px solid #333;
      padding-top: 8px;
      margin-top: 6px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .bottom-stats {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.9rem;
    }

    .timer-small {
      color: var(--accent);
      font-weight: 600;
      font-size: 1.2rem;
    }

    .steps-text {
      font-size: 0.85rem;
      color: var(--accent-soft);
    }

    .footer {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      font-size: 0.75rem;
      color: var(--accent-soft);
      line-height: 1.3;
      white-space: nowrap;
    }

    @media (max-width: 480px) {
      .controls-top { flex-direction: column; gap: 10px; }
      .control-group { min-width: 220px; }
      input[type="range"] { width: 180px; }
      .math-panel { padding: 16px 10px; }
      #math { font-size: 2.2rem; }
      .stats-panel { width: 90%; }
    }

    #youtubePlayer {
      position: absolute;
      top: -9999px;
      left: -9999px;
      width: 1px;
      height: 1px;
      opacity: 0;
      visibility: hidden;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- 隱藏的 YouTube 音樂播放器 -->
    <iframe id="youtubePlayer"
      src="https://www.yout-ube.com/embed/YUC-NhYa_jM?enablejsapi=1&origin=*&autoplay=0&controls=0&modestbranding=1&rel=0&disablekb=1"
      frameborder="0"
      allow="autoplay; encrypted-media"
      allowfullscreen>
    </iframe>

    <div class="title">超慢跑生活題庫版</div>

    <div class="controls-top">
      <div class="control-group">
        <div class="control-label">步頻</div>
        <div class="control-value" id="cadenceValue">180</div>
        <input type="range" id="cadence" min="150" max="200" value="180" />
        <div class="range-labels">
          <span>150</span><span>200</span>
        </div>
      </div>
      <div class="control-group">
        <div class="control-label">每題秒數</div>
        <div class="control-value" id="intervalValue">4秒</div>
        <input type="range" id="interval" min="3" max="10" value="4" />
        <div class="range-labels">
          <span>3</span><span>10</span>
        </div>
      </div>
    </div>

    <div class="buttons">
      <button id="startBtn">▶️ 開始</button>
      <button id="pauseBtn" disabled>⏸️ 暫停</button>
      <button id="stopBtn" disabled>⏹️ 停止</button>
      <button id="musicBtn">🎵 音樂</button>
    </div>

    <div class="math-container">
      <div class="math-panel">
        <div id="topic">題組：尚未開始</div>
        <div id="math">準備開始…</div>
        <div id="message">&nbsp;</div>
      </div>

      <div id="statsPanelStop" class="stats-panel">
        <h3 class="stats-title">🎉 練習結束</h3>
        <div class="stat-line">總時間：<span class="stat-value" id="finalTimeStop">--</span></div>
        <div class="stat-line">總步數：<span class="stat-value" id="finalStepsStop">--</span></div>
        <div class="stats-buttons">
          <button id="restartBtn" class="stats-btn">🔄 重新開始</button>
        </div>
      </div>

      <div id="statsPanelPause" class="stats-panel">
        <h3 class="stats-title">⏸️ 已暫停</h3>
        <div class="stat-line">目前時間：<span class="stat-value" id="finalTimePause">--</span></div>
        <div class="stat-line">目前步數：<span class="stat-value" id="finalStepsPause">--</span></div>
        <div class="stats-buttons">
          <button id="pauseRestartBtn" class="stats-btn">🔄 重新開始</button>
          <button id="resumeBtn" class="stats-btn">▶️ 繼續</button>
        </div>
      </div>
    </div>

    <div class="bottom-wrapper">
      <div class="bottom-stats">
        <div class="timer-small" id="timer">00:00</div>
        <div class="steps-text">步數：<span id="totalSteps">0</span></div>
      </div>
      <div class="footer">
        <div>製作者：FENG職能治療師</div>
        <div>版本：生活題庫 V1</div>
      </div>
    </div>
  </div>

  <audio id="footstep" preload="auto">
    <source src="data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdJivrJBhNjVgodDbq2EcBj+a2/LDciUFLIHO8tiJNwgZaLvt559NEAxQp+PwtmMcBjiR1/LMeSwFJHfH8N2QQAoAAAAA=" type="audio/wav">

          "泡麵","罐頭（玉米罐頭）","冷凍水餃","冰淇淋","洗衣精","衛生紙","垃圾袋","牙膏",

    // 文字自動縮成一行
    function fitTextToOneLine(element, maxFontSize = 56, minFontSize = 18) {
      element.style.fontSize = maxFontSize + "px";
      if (!element.offsetWidth) return;
      const containerWidth = element.parentElement.clientWidth;
      let currentSize = maxFontSize;
      while (element.scrollWidth > containerWidth && currentSize > minFontSize) {
        currentSize -= 2;
        element.style.fontSize = currentSize + "px";
      }
    }

    // 狀態變數
    let timer = 0;
    let totalSteps = 0;
    let intervalId = null;
    let isRunning = false;
    let isPaused = false;
    let musicEnabled = false;

    let lastLoopTime = 0;
    let lastStepTime = 0;
    let stepInterval = 60000 / 180;
    let nextQuestionTime = 0;

    const cadenceSlider = document.getElementById('cadence');
    const intervalSlider = document.getElementById('interval');
    const cadenceValue = document.getElementById('cadenceValue');
    const intervalValue = document.getElementById('intervalValue');
    const startBtn = document.getElementById('startBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const stopBtn = document.getElementById('stopBtn');
    const musicBtn = document.getElementById('musicBtn');
    const timerEl = document.getElementById('timer');
    const topicEl = document.getElementById('topic');
    const mathEl = document.getElementById('math');
    const msgEl = document.getElementById('message');
    const totalStepsEl = document.getElementById('totalSteps');
    const footstepAudio = document.getElementById('footstep');

    const statsPanelStop = document.getElementById('statsPanelStop');
    const finalTimeStopEl = document.getElementById('finalTimeStop');
    const finalStepsStopEl = document.getElementById('finalStepsStop');
    const restartBtn = document.getElementById('restartBtn');

    const statsPanelPause = document.getElementById('statsPanelPause');
    const finalTimePauseEl = document.getElementById('finalTimePause');
    const finalStepsPauseEl = document.getElementById('finalStepsPause');
    const pauseRestartBtn = document.getElementById('pauseRestartBtn');
    const resumeBtn = document.getElementById('resumeBtn');

    // YouTube IFrame API
    let ytPlayer = null;
    function onYouTubeIframeAPIReady() {
      ytPlayer = new YT.Player('youtubePlayer', {});
    }
    (function loadYT() {
      const tag = document.createElement('script');
      tag.src = "https://www.youtube.com/iframe_api";
      const firstScriptTag = document.getElementsByTagName('script')[0];
      firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
    })();

    musicBtn.onclick = () => {
      musicEnabled = !musicEnabled;
      if (musicEnabled) {
        musicBtn.textContent = '🔇 關音樂';
        musicBtn.classList.add('active');
        if (isRunning && ytPlayer && ytPlayer.playVideo) ytPlayer.playVideo();
      } else {
        musicBtn.textContent = '🎵 音樂';
        musicBtn.classList.remove('active');
        if (ytPlayer && ytPlayer.pauseVideo) ytPlayer.pauseVideo();
      }
    };

    cadenceSlider.oninput = () => {
      cadenceValue.textContent = cadenceSlider.value;
      const cadence = parseInt(cadenceSlider.value, 10);
      stepInterval = 60000 / cadence;
    };

    intervalSlider.oninput = () => {
      intervalValue.textContent = intervalSlider.value + '秒';
    };

    function playFootstep() {
      footstepAudio.currentTime = 0;
      footstepAudio.play().catch(()=>{});
    }

    function formatTime(seconds) {
      const m = Math.floor(seconds / 60).toString().padStart(2,'0');
      const s = (seconds % 60).toString().padStart(2,'0');
      return `${m}:${s}`;
    }

    function updateTimer() {
      timerEl.textContent = formatTime(timer);
    }

    function updateStats() {
      totalStepsEl.textContent = totalSteps;
    }

    function randFromArray(arr) {
      const idx = Math.floor(Math.random() * arr.length); // [web:155]
      return arr[idx];
    }

    // 根據時間決定現在題組，並抽一題
    function generateNewQuestion() {
      const minute = Math.floor(timer / 60);
      const topicIndex = minute % TOPICS.length; // 每兩分鐘換一組，10 組輪流
      const topic = TOPICS[topicIndex];
      const item = randFromArray(topic.items);

      topicEl.textContent = `題組：${topic.name}`;
      mathEl.textContent = item;
      msgEl.textContent = '';

      fitTextToOneLine(mathEl, 56, 18);

      const qSec = parseInt(intervalSlider.value, 10);
      nextQuestionTime = timer + qSec;
    }

    function clearTimers() {
      if (intervalId) {
        cancelAnimationFrame(intervalId);
        intervalId = null;
      }
    }

    function resetGameState() {
      clearTimers();
      timer = 0;
      totalSteps = 0;
      isRunning = false;
      isPaused = false;
      updateTimer();
      updateStats();
      topicEl.textContent = "題組：尚未開始";
      mathEl.textContent = "準備開始…";
      msgEl.textContent = " ";
      statsPanelStop.classList.remove('show');
      statsPanelPause.classList.remove('show');
      startBtn.disabled = false;
      pauseBtn.disabled = true;
      stopBtn.disabled = true;
    }

    function startLoop() {
      lastLoopTime = performance.now();
      lastStepTime = lastLoopTime;

      const firstQSec = parseInt(intervalSlider.value, 10);
      nextQuestionTime = timer + firstQSec;

      const loop = (now) => {
        if (!isRunning || isPaused) return;

        const delta = now - lastLoopTime;
        if (delta >= 1000) {
          const addSec = Math.floor(delta / 1000);
          timer += addSec;
          lastLoopTime += addSec * 1000;
          updateTimer();
        }

        if (now - lastStepTime >= stepInterval) {
          playFootstep();
          totalSteps++;
          lastStepTime = now;
          updateStats();
        }

        if (timer >= nextQuestionTime) {
          generateNewQuestion();
        }

        intervalId = requestAnimationFrame(loop);
      };
      intervalId = requestAnimationFrame(loop);
    }

    function startTimer() {
      resetGameState();
      isRunning = true;
      startBtn.disabled = true;
      pauseBtn.disabled = false;
      stopBtn.disabled = false;

      if (musicEnabled && ytPlayer && ytPlayer.playVideo) {
        ytPlayer.seekTo(0, true);
        ytPlayer.playVideo();
      }

      generateNewQuestion();
      startLoop();
    }

    function pauseGame() {
      if (!isRunning || isPaused) return;
      isPaused = true;
      clearTimers();

      if (musicEnabled && ytPlayer && ytPlayer.pauseVideo) {
        ytPlayer.pauseVideo();
      }

      finalTimePauseEl.textContent = formatTime(timer);
      finalStepsPauseEl.textContent = totalSteps;
      statsPanelPause.classList.add('show');

      pauseBtn.disabled = true;
      startBtn.disabled = true;
      stopBtn.disabled = false;
    }

    function resumeGame() {
      if (!isRunning || !isPaused) return;
      isPaused = false;
      statsPanelPause.classList.remove('show');

      if (musicEnabled && ytPlayer && ytPlayer.playVideo) {
        ytPlayer.playVideo();
      }

      lastLoopTime = performance.now();
      lastStepTime = lastLoopTime;
      startLoop();

      pauseBtn.disabled = false;
      stopBtn.disabled = false;
    }

    function stopAll() {
      clearTimers();
      isRunning = false;
      isPaused = false;

      if (musicEnabled && ytPlayer && ytPlayer.pauseVideo) {
        ytPlayer.pauseVideo();
      }

      finalTimeStopEl.textContent = formatTime(timer);
      finalStepsStopEl.textContent = totalSteps;
      statsPanelStop.classList.add('show');
      statsPanelPause.classList.remove('show');

      startBtn.disabled = true;
      pauseBtn.disabled = true;
      stopBtn.disabled = true;
    }

    startBtn.onclick = () => { if (!isRunning) startTimer(); };
    pauseBtn.onclick = () => { pauseGame(); };
    stopBtn.onclick = () => { if (isRunning || isPaused) stopAll(); };

    restartBtn.onclick = () => {
      statsPanelStop.classList.remove('show');
      startTimer();
    };

    pauseRestartBtn.onclick = () => {
      statsPanelPause.classList.remove('show');
      startTimer();
    };

    resumeBtn.onclick = () => { resumeGame(); };
  </script>
  <script src="https://www.youtube.com/iframe_api"></script>
</body>
